<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ | SunFlowerPC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/pages/index.html"><img src="/assets/logo.svg" alt=""> SunFlowerPC</a>
    <nav class="nav-links"></nav>
  </header>
  <main class="container">
    <form class="form card" id="reset-form">
      <div class="kicker">Account</div>
      <h2>ตั้งรหัสผ่านใหม่</h2>
      <div id="msg"></div>
      <label>รหัสผ่านใหม่</label>
      <input name="password" type="password" minlength="6" required autocomplete="new-password">
      <label>ยืนยันรหัสผ่านใหม่</label>
      <input name="confirm" type="password" minlength="6" required autocomplete="new-password">
      <div class="btn-row"><button class="btn" type="submit" id="submit-btn">บันทึกรหัสผ่านใหม่</button></div>
      <p class="muted"><a href="/pages/forgot-password.html">ขอลิงก์ใหม่</a></p>
    </form>
  </main>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
