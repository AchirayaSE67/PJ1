<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลืมรหัสผ่าน | SunFlowerPC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/pages/index.html"><img src="/assets/logo.svg" alt=""> SunFlowerPC</a>
    <nav class="nav-links"></nav>
  </header>
  <main class="container">
    <form class="form card" id="forgot-form">
      <div class="kicker">Account</div>
      <h2>ลืมรหัสผ่าน</h2>
      <p class="muted">กรอกอีเมลที่ใช้สมัคร เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
      <div id="msg"></div>
      <label>อีเมล</label>
      <input name="email" type="email" required>
      <div class="btn-row"><button class="btn" type="submit" id="submit-btn">ส่งลิงก์ตั้งรหัสผ่านใหม่</button></div>
      <p class="muted"><a href="/pages/login.html">กลับไปเข้าสู่ระบบ</a></p>
    </form>
  </main>
  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
