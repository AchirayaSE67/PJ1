<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | SunFlowerPC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/pages/index.html"><img src="/assets/logo.svg" alt=""> SunFlowerPC</a>
    <nav class="nav-links"></nav>
  </header>
  <main class="container">
    <form class="form card" id="login-form">
      <div class="kicker">Account</div>
      <h2>เข้าสู่ระบบ</h2>
      <p class="muted">ต้องเข้าสู่ระบบก่อนเติมเครดิตหรือเช่าเครื่อง</p>
      <div id="msg"></div>
      <label>อีเมล</label>
      <input name="email" type="email" required>
      <label>รหัสผ่าน</label>
      <input name="password" type="password" required>
      <div class="btn-row"><button class="btn" type="submit">เข้าสู่ระบบ</button></div>
      <p class="muted"><a href="/pages/forgot-password.html">ลืมรหัสผ่าน?</a></p>
      <p class="muted">ยังไม่มีบัญชี? <a href="/pages/register.html">สมัครสมาชิก</a></p>
    </form>
  </main>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
